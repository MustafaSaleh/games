name: Deploy games to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build every game folder that has a package.json
        run: |
          set -e
          mkdir -p _site
          cp index.html _site/
          for dir in */; do
            name="${dir%/}"
            [ -f "$name/package.json" ] || continue
            echo "::group::Building $name"
            (cd "$name" && npm ci && npm test --if-present && npm run build)
            mkdir -p "_site/$name"
            cp -r "$name/dist/." "_site/$name/"
            echo "::endgroup::"
          done
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
